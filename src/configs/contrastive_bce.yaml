# Contrastive-BCE configuration.

data:
  csv_path: src/data/csv_dataset/fungtion_dataset.csv
  embedding_dir: src/data/embeddings/prott5_dropout_variants_packed
  results_dir: results/contrastive_bce

features:
  normalize: true
  pooling_type: mean

model:
  type: simple_predictor
  input_dim: 1024
  output_dim: 1
  dropout_rate: 0.2
  use_contrastive: true
  contrastive_dim: 128
  encoder_hidden_dim: 512

training:
  batch_size: 256
  num_folds: 5
  threshold_method: youden
  target_recall: 0.85
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_epochs: 5
  early_stopping_patience: 8
  grad_clip_value: 2.0
  use_variants: true
  variant_sampling:
    enabled: true
    num_variants: 8
    always_include_original: true
  loss_type: contrastive_bce
  bce_weight: 1.0
  unsupervised_weight: 0.4
  temperature: 0.07
  monitor_metric: auprc
  mode: max
  lr_scheduler:
    scheduler_type: cosine
    eta_min: 1.0e-7

output:
  save_checkpoints: true
  plot_training_curves: true

hardware:
  gpu_id: 0
  random_seed: 42
  deterministic: true
  debug_logging: false
  num_workers: 0
